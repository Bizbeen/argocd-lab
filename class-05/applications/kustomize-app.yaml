apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Bizbeen/argocd-lab.git
    targetRevision: main
    path: class-05/kustomize/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: kustomize-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
