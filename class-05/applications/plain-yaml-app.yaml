apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plain-yaml-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Bizbeen/argocd-lab.git
    targetRevision: HEAD
    path: class-05/plain-yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: plain-yaml

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
