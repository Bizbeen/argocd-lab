apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Bizbeen/argocd-lab.git
    targetRevision: main
    path: class-05/helm/webapp

  destination:
    server: https://kubernetes.default.svc
    namespace: helm-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=truei
