apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: class-09-parent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Bizbeen/argocd-lab.git
    targetRevision: main
    path: class-09/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
